services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  catalog-service:
    build:
      context: .
      dockerfile: CatalogService/CatalogService/Dockerfile

  inventory-service:
    build:
      context: .
      dockerfile: InventoryService/InventoryService/Dockerfile
    environment:
      - Rabbit__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: PaymentService/Dockerfile
    environment:
      - Rabbit__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: OrderService/OrderService/Dockerfile
    environment:
      - Rabbit__Host=rabbitmq
      - Services__Catalog=http://catalog-service:8080
      - Services__Inventory=http://inventory-service:8080
      - Services__Payment=http://payment-service:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started

  auth-service:
    build: ./AuthService
    environment:
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Seed__AdminEmail=${ADMIN_EMAIL}
      - Seed__AdminPassword=${ADMIN_PASSWORD}

  gateway:
    build: ./ApiGateway
    ports:
      - "8080:8080"     # the single entry point: http://localhost:8080
    environment:
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    depends_on:
      - auth-service
      - catalog-service
      - inventory-service
      - order-service
      - payment-service

  storefront:
    build: ./Storefront
    ports:
      - "5000:8080"     # the store UI: http://localhost:5000
    environment:
      - Gateway__BaseUrl=http://gateway:8080/
    depends_on:
      - gateway
