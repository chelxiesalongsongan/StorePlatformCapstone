openapi: 3.0.3
info:
  title: Payment Service API
  description: API contract for payment processing, charging, and refunds.
  version: 1.0.0

servers:
  - url: http://localhost:5212

tags:
  - name: Payments
    description: Payment management and processing operations

paths:
  /payments/v1/payments:
    get:
      tags:
        - Payments
      summary: Retrieve all payments
      operationId: getPayments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

    post:
      tags:
        - Payments
      summary: Create a payment record
      operationId: createPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          description: Payment already exists for this order
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid payment request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /payments/v1/payments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32

    get:
      tags:
        - Payments
      summary: Retrieve a payment by ID
      operationId: getPaymentById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Payment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    put:
      tags:
        - Payments
      summary: Update payment status
      operationId: updatePayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentRequest'
      responses:
        '200':
          description: Payment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid payment request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Payment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      tags:
        - Payments
      summary: Delete a payment record
      operationId: deletePayment
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Payment deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Payment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /payments/v1/payments/charge:
    post:
      tags:
        - Payments
      summary: Charge an order payment
      description: Idempotent per OrderId. Returns an existing payment when one already exists.
      operationId: chargePayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
      responses:
        '200':
          description: Payment successfully charged or existing payment returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '402':
          description: Payment declined
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid payment request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /payments/v1/payments/{id}/refund:
    post:
      tags:
        - Payments
      summary: Refund a charged payment
      description: Idempotent. An already refunded payment is returned without another refund.
      operationId: refundPayment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Payment refunded or already refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Payment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int32
        orderId:
          type: integer
          format: int32
        amount:
          type: number
        status:
          type: string
          enum:
            - Pending
            - Charged
            - Failed
            - Refunded
        createdAt:
          type: string
          format: date-time
        correlationId:
          type: string
          nullable: true

    ChargeRequest:
      type: object
      required:
        - orderId
        - amount
      properties:
        orderId:
          type: integer
          format: int32
          minimum: 1
        amount:
          type: number
          minimum: 0.01
          maximum: 1000000
        forceFailure:
          type: boolean
          default: false

    UpdatePaymentRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - Pending
            - Charged
            - Failed
            - Refunded

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
