openapi: 3.0.3
info:
  title: Order Service API
  description: >
    API contract for placing and tracking customer orders. Placing an order starts an
    event-driven saga over RabbitMQ (reserve stock, charge payment, confirm), so the
    order is accepted as Pending and moves to Confirmed or Cancelled asynchronously.
  version: 1.1.0

servers:
  - url: http://localhost:8080
    description: Through the API gateway (Docker)
  - url: http://localhost:5262
    description: Order service directly (local development)

tags:
  - name: Orders
    description: Order placement and tracking

paths:
  /orders/v1/orders:
    get:
      tags:
        - Orders
      summary: Retrieve the caller's orders
      description: Returns the orders of the logged-in customer (identified by the X-User-Id header the gateway forwards).
      operationId: getOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden

    post:
      tags:
        - Orders
      summary: Place a new order
      description: >
        Validates the products and prices through the Catalog service, saves the order as
        Pending and publishes OrderPlaced. Follow the Location header to see the outcome.
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '202':
          description: Order accepted and the saga started; status is Pending
          headers:
            Location:
              description: URL of the new order
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: A product in the order does not exist in Catalog
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Catalog service error or unreachable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Catalog circuit open, or the message broker is unavailable (the order is cancelled)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: Catalog service timed out
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orders/v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32

    get:
      tags:
        - Orders
      summary: Retrieve an order with its status history
      operationId: getOrderById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    put:
      tags:
        - Orders
      summary: Update an existing order (not supported once placed)
      description: Orders are processed as soon as they are placed, so this always returns 409 for an existing order.
      operationId: updateOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The order cannot be changed after it is placed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      tags:
        - Orders
      summary: Delete a finished order
      operationId: deleteOrder
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Order deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The order is still processing (not Confirmed or Cancelled yet)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orders/v1/orders/{id}/items:
    get:
      tags:
        - Orders
      summary: Retrieve items of an order
      operationId: getOrderItems
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Order items retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItem'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int32
        customerId:
          type: string
          description: ID of the customer who placed the order (from the JWT, forwarded by the gateway)
        customerName:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        failureReason:
          type: string
          nullable: true
          description: Why the order was cancelled, when it was
        totalAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        history:
          type: array
          description: Every status the order has been through, oldest first
          items:
            $ref: '#/components/schemas/OrderStatusEntry'

    OrderStatus:
      type: string
      enum:
        - Pending
        - StockReserved
        - Confirmed
        - Cancelled

    OrderStatusEntry:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        at:
          type: string
          format: date-time

    OrderInput:
      type: object
      required:
        - customerName
        - items
      properties:
        customerName:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'

    OrderItem:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
          description: Price taken from the Catalog service when the order was placed

    OrderItemInput:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int32
          minimum: 1
        quantity:
          type: integer
          format: int32
          minimum: 1

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
